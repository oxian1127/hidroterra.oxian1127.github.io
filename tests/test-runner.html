<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIDROTERRA — Suite de Pruebas Unitarias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" />
  <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css" />
  <style>
    body {
      font-family: 'Open Sans', 'Open_Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h1 { color: #1b4332; }
    .btn {
      background-color: #2d6a4f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background-color: #1b4332; }
  </style>
</head>
<body>
  <h1>Suite de Pruebas Automatizadas — HIDROTERRA</h1>
  <p>Verificación de validadores, acumulados de lluvia, persistencia IndexedDB y respaldos JSON.</p>
  <div style="margin-bottom: 20px;">
    <button class="btn" id="btn-run-all-tests">Re-ejecutar Todas las Pruebas</button>
    <a href="../index.html" style="margin-left: 12px; color: #0077b6; text-decoration: none;">← Volver a la Aplicación Principal</a>
  </div>

  <div id="test-results-container"></div>

  <script type="module">
    import { suite } from './test-runner.js';
    import { runValidatorsTests } from './validators.test.js';
    import { runRainfallTests } from './rainfall.test.js';
    import { runBackupTests } from './backup.test.js';
    import { runRepositoriesTests } from './repositories.test.js';

    // Registrar todas las suites
    runValidatorsTests(suite);
    runRainfallTests(suite);
    runBackupTests(suite);
    runRepositoriesTests(suite);

    const container = document.getElementById('test-results-container');
    const runBtn = document.getElementById('btn-run-all-tests');

    async function execute() {
      await suite.run(container);
    }

    runBtn.addEventListener('click', execute);
    execute();
  </script>
</body>
</html>
